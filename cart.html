<!DOCTYPE html>
<html lang="my">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — MyShop.mm</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="topbar"><i class="bi bi-truck"></i>Free delivery in Yangon over 50,000 Ks</div>
  <header>
    <div class="navbar">
      <div class="nav-left">
        <button class="icon-btn hamburger" onclick="toggleMenu()" aria-label="Menu"><i class="bi bi-list"></i></button>
        <a class="logo" href="index.html"><i class="bi bi-bag-heart-fill logo-icon"></i>MyShop<span>.mm</span></a>
      </div>
      <nav class="links" id="navLinks">

        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html" class="active">Cart</a>
        <a href="checkout.html">Checkout</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn search-toggle" onclick="toggleSearch()" aria-label="Search"><i
            class="bi bi-search"></i></button>
        <button class="cart-btn" onclick="openDrawer()" aria-label="Cart"><i class="bi bi-cart3"></i><span
            class="cart-count">0</span></button>
      </div>
    </div>
    <div class="mobile-search" id="mobileSearch">
      <div class="mobile-search-inner">
        <i class="bi bi-search"></i>
        <input placeholder="Search products... (e.g. coffee, watch)">
        <button onclick="mobileSearchGo()">Search</button>
      </div>
    </div>
  </header>

  <section class="section container">
    <h2 class="section-title"><i class="bi bi-cart3"></i> Shopping Cart</h2>
    <p class="section-sub">ခြင်းတောင်း</p>
    <div id="cartPage"></div>
  </section>

  <footer>
    <div class="copy">© 2026 MyShop.mm</div>
  </footer>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="cartDrawer">
    <div class="drawer-head">
      <h3><i class="bi bi-cart3"></i>Your Cart</h3><button class="drawer-close" onclick="closeDrawer()"
        aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="drawer-items" id="drawerItems"></div>
    <div class="drawer-foot">
      <div class="total-row"><span>Total</span><span id="drawerTotal">0 Ks</span></div>
      <a class="btn" style="width:100%" href="checkout.html">Checkout<i class="bi bi-arrow-right"></i></a>
    </div>
  </aside>
  <div id="toast"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderPage() {
      const box = document.getElementById("cartPage");
      if (!cart.length) {
        box.innerHTML = `<div class="form-card" style="text-align:center"><div class="drawer-empty" style="padding:10px"><i class="bi bi-cart-x"></i><h3>Cart is empty</h3><p style="color:#666">ခြင်းတောင်းဗလာဖြစ်နေပါတယ်</p></div><br><a class="btn" href="shop.html"><i class="bi bi-bag-fill"></i>Continue Shopping</a></div>`;
        return;
      }
      const sub = cartTotal();
      const ship = sub >= 50000 ? 0 : 3000;
      box.innerHTML = `<div style="display:grid;grid-template-columns:2fr 1fr;gap:20px" class="cart-layout">
    <div>${cart.map(i => {
        const p = PRODUCTS.find(p => p.id === i.id); if (!p) return "";
        return `<div class="cart-item" style="background:#fff"><img src="${p.img}" alt="">
      <div style="flex:1;min-width:0"><b>${p.name}</b><div style="color:var(--primary);font-weight:700">${formatMMK(p.price)}</div>
      <div class="qty"><button onclick="changeQty(${p.id},-1);renderPage()" aria-label="Decrease"><i class="bi bi-dash"></i></button><b>${i.qty}</b><button onclick="changeQty(${p.id},1);renderPage()" aria-label="Increase"><i class="bi bi-plus"></i></button>
      <a href="#" class="remove-link" onclick="removeItem(${p.id});renderPage();return false"><i class="bi bi-trash"></i>Remove</a></div></div>
      <b>${formatMMK(p.price * i.qty)}</b></div>`;
      }).join("")}</div>
    <div class="form-card" style="height:fit-content"><h3><i class="bi bi-receipt"></i> Order Summary</h3>
      <div class="order-summary">
        <div style="display:flex;justify-content:space-between"><span>Subtotal</span><b>${formatMMK(sub)}</b></div>
        <div style="display:flex;justify-content:space-between"><span>Delivery</span><b>${ship === 0 ? "FREE" : formatMMK(ship)}</b></div>
        <hr style="margin:10px 0;border:none;border-top:1px solid #ddd">
        <div style="display:flex;justify-content:space-between;font-size:18px"><span><b>Total</b></span><b style="color:var(--primary)">${formatMMK(sub + ship)}</b></div>
      </div>
      <a class="btn" style="width:100%" href="checkout.html">Proceed to Checkout<i class="bi bi-arrow-right"></i></a>
      <a class="btn btn-outline" style="width:100%;margin-top:8px" href="shop.html"><i class="bi bi-bag-fill"></i>Continue Shopping</a>
    </div></div>`;
    }
    renderPage();
  </script>
  <style>
    @media(max-width:860px) {
      .cart-layout {
        grid-template-columns: 1fr !important
      }
    }
  </style>
</body>

</html>
