<!DOCTYPE html>
<html lang="my">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — MyShop.mm</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="topbar"><i class="bi bi-truck"></i>Free delivery in Yangon over 50,000 Ks</div>
  <header>
    <div class="navbar">
      <div class="nav-left">
        <button class="icon-btn hamburger" onclick="toggleMenu()" aria-label="Menu"><i class="bi bi-list"></i></button>
        <a class="logo" href="index.html"><i class="bi bi-bag-heart-fill logo-icon"></i>MyShop<span>.mm</span></a>
      </div>
      <nav class="links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn search-toggle" onclick="toggleSearch()" aria-label="Search"><i
            class="bi bi-search"></i></button>
        <button class="cart-btn" onclick="openDrawer()" aria-label="Cart"><i class="bi bi-cart3"></i><span
            class="cart-count">0</span></button>
      </div>
    </div>
    <div class="mobile-search" id="mobileSearch">
      <div class="mobile-search-inner">
        <i class="bi bi-search"></i>
        <input placeholder="Search products... (e.g. coffee, watch)">
        <button onclick="mobileSearchGo()">Search</button>
      </div>
    </div>
  </header>

  <section class="section container">
    <h2 class="section-title"><i class="bi bi-grid-fill"></i> All Products</h2>
    <p class="section-sub">Search, filter & sort — WooCommerce shop page logic demo</p>
    <div class="cat-row" id="catRow"></div>
    <div class="toolbar">
      <div class="toolbar-search"><i class="bi bi-search"></i><input id="searchInput"
          placeholder="Search products... (e.g. coffee, watch)"></div>
      <select id="sortSel" onchange="_renderShop()">
        <option value="pop">Sort: Popular</option>
        <option value="low">Price: Low → High</option>
        <option value="high">Price: High → Low</option>
        <option value="rate">Top Rated</option>
      </select>
    </div>
    <p id="count" style="color:#666;margin-bottom:14px"></p>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <div class="copy">© 2026 MyShop.mm — Interview Portfolio Project</div>
  </footer>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="cartDrawer">
    <div class="drawer-head">
      <h3><i class="bi bi-cart3"></i>Your Cart</h3><button class="drawer-close" onclick="closeDrawer()"
        aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="drawer-items" id="drawerItems"></div>
    <div class="drawer-foot">
      <div class="total-row"><span>Total</span><span id="drawerTotal">0 Ks</span></div>
      <a class="btn" style="width:100%" href="cart.html">View Cart & Checkout<i class="bi bi-arrow-right"></i></a>
    </div>
  </aside>
  <div id="toast"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let activeCat = params.get("cat") || "all";
    const q0 = params.get("q") || "";
    if (q0) document.getElementById("searchInput").value = q0;

    function renderCats() {
      document.getElementById("catRow").innerHTML = CATEGORIES.map(c =>
        `<button class="cat-pill ${c.slug === activeCat ? 'active' : ''}" onclick="setCat('${c.slug}')"><i class="bi ${c.icon}"></i>${c.label}</button>`).join("");
    }
    function setCat(s) { activeCat = s; renderCats(); _renderShop(); }
    window._renderShop = function () {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const sort = document.getElementById("sortSel").value;
      let list = PRODUCTS.filter(p =>
        (activeCat === "all" || p.category === activeCat) &&
        (p.name.toLowerCase().includes(q) || p.name_mm.includes(q) || p.category.includes(q)));
      if (sort === "low") list.sort((a, b) => a.price - b.price);
      else if (sort === "high") list.sort((a, b) => b.price - a.price);
      else if (sort === "rate") list.sort((a, b) => b.rating - a.rating);
      else list.sort((a, b) => b.reviews - a.reviews);
      document.getElementById("count").textContent = `Found ${list.length} products`;
      document.getElementById("grid").innerHTML = list.length
        ? list.map(productCard).join("")
        : `<p style="text-align:center;color:#888;padding:30px"><i class="bi bi-search" style="font-size:32px"></i><br>No products found.</p>`;
    };
    renderCats(); _renderShop();
  </script>
</body>

</html>
